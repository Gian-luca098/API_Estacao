services:
  estacao-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: estacao-meteorologica-api:latest
    container_name: estacao-meteorologica-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Host/porta/usuário do Postgres do Supabase. Os defaults abaixo usam a conexão
      # DIRETA (IPv6) derivada do projeto identificado em Front_Estacao-main/.env. Se sua
      # rede não tiver saída IPv6 (comum em Docker Desktop / provedores só-IPv4), troque
      # os três por DB_HOST=aws-0-<regiao>.pooler.supabase.com, DB_PORT=5432 e
      # DB_USER=postgres.<ref-do-projeto> — valores exatos em Project Settings > Database >
      # Connect > "Session pooler" no painel do Supabase.
      DB_HOST: ${DB_HOST:-db.eyuggwjixeuraiqjbnze.supabase.co}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres}
      # Obrigatória: senha do banco (Project Settings > Database), NÃO é a anon key do
      # front-end. Sem ela o container falha ao subir com uma mensagem clara.
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env com a senha do banco do Supabase}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173,http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
